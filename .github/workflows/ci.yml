name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        # The image's own user is a superuser (which skips row-level security); the API connects as
        # the ordinary role created from docker/db-init.sql below, as in docker-compose.
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://sampledge:sampledge@localhost:5432/sampledge?schema=public
      JWT_SECRET: ci-only-secret-not-for-production
      LOGIN_RATE_LIMIT: "200"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Create the application role and database
        run: psql "postgresql://postgres:postgres@localhost:5432/postgres" -v ON_ERROR_STOP=1 -f docker/db-init.sql
      - run: npm ci
      - run: npm run typecheck
      # Engine unit tests + API integration tests (the API suite creates and migrates sampledge_test).
      - run: npm test
      - run: npm run build
      - name: Migrate and seed the dev database
        run: npx prisma migrate deploy && node dist/seed.js
        working-directory: apps/api
      - name: End-to-end smoke test (production build)
        run: |
          npm i --no-save playwright@1.55.0 && npx playwright install --with-deps chromium
          (cd apps/api && node dist/main.js > /tmp/api.log 2>&1 &) ; (cd apps/web && npx next start -p 3000 > /tmp/web.log 2>&1 &)
          npx --yes wait-on@8.0.3 -t 60000 http://localhost:4000/api/v1/health http://localhost:3000/login
          # On failure, surface the failing steps and server log tails as annotations, so they can be
          # read from the check run without downloading the job log.
          node apps/web/e2e-smoke.cjs 2>&1 | tee /tmp/e2e.log; code=${PIPESTATUS[0]}
          if [ "$code" != 0 ]; then
            grep -vE '^PASS' /tmp/e2e.log | tail -20 | while IFS= read -r l; do echo "::error title=e2e::$l"; done
            tail -15 /tmp/api.log | while IFS= read -r l; do echo "::warning title=api log::$l"; done
            tail -10 /tmp/web.log | while IFS= read -r l; do echo "::warning title=web log::$l"; done
          fi
          exit $code
