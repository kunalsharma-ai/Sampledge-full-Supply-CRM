# Local stack: Postgres + API + web.
#   docker compose up --build
#   docker compose run --rm -e NODE_ENV=development api node dist/seed.js   # load the demo data
# Upgrading from a Phase 3-5 volume (where `sampledge` was the superuser)? Run `docker compose down -v` once.
# Then open http://localhost:3000 and use a demo account (password demo1234).
services:
  db:
    image: postgres:16-alpine
    environment:
      # Administrative superuser for the container only. The API connects as the ordinary
      # role `sampledge` created by docker/db-init.sql, so row-level security applies to it.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres-dev-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db-init.sql:/docker-entrypoint-initdb.d/01-app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sampledge"]
      interval: 5s
      retries: 10

  api:
    image: sampledge-api
    build: { context: ., target: api }
    environment:
      DATABASE_URL: postgresql://sampledge:sampledge@db:5432/sampledge?schema=public
      # Change before exposing this stack to anyone. Production refuses secrets starting with "dev-".
      JWT_SECRET: ${JWT_SECRET:-dev-compose-secret-change-me}
      WEB_ORIGIN: http://localhost:3000
      NODE_ENV: ${API_NODE_ENV:-development}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-60}
    depends_on: { db: { condition: service_healthy } }
    ports: ["4000:4000"]

  web:
    image: sampledge-web
    build: { context: ., target: web, args: { API_ORIGIN: "http://api:4000" } }
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  pgdata:
