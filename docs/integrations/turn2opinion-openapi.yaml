openapi: 3.0.3
info:
  title: Turn2Opinion Backend API
  description: 'Observed API endpoints contract for the Turn2Opinion multi-tenant
    panel platform (Turn2Opinion, MyFrequentRewards, MyHealthOpinions).


    **Multi-Tenancy & Host Resolution**:

    The backend uses dynamic origin/host extraction (`req.headers.host`) to partition
    tenant data across three panels:

    - `t2o`: Turn2Opinion (turn2opinion.com / t2o.localhost)

    - `mfr`: MyFrequentRewards (myfrequentrewards.com / mfr.localhost)

    - `mho`: MyHealthOpinions (myhealthopinions.com / mho.localhost)


    **Default Local Endpoint**:

    `http://{panel}.localhost` where `panel` is one of `t2o`, `mfr`, or `mho`.'
  version: 1.0.0
servers:
- url: http://{panel}.localhost
  description: Local Development (Default)
  variables:
    panel:
      default: t2o
      enum:
      - t2o
      - mfr
      - mho
      description: 'Panel identifier: t2o (Turn2Opinion), mfr (MyFrequentRewards),
        mho (MyHealthOpinions)'
- url: https://{panel}.sampledge.duckdns.org
  description: Development / Staging Server
  variables:
    panel:
      default: t2o
      enum:
      - t2o
      - mfr
      - mho
      description: Panel staging environment subdomain
- url: https://www.turn2opinion.com
  description: Turn2Opinion Production Server
- url: https://www.myfrequentrewards.com
  description: MyFrequentRewards Production Server
- url: https://www.myhealthopinions.com
  description: MyHealthOpinions Production Server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Bearer token via Authorization header: `Bearer <token>`'
    cookieAuth:
      type: apiKey
      in: cookie
      name: authorization
      description: 'JWT token in authorization cookie: `Bearer <token>`'
  schemas:
    StandardSuccessResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
        data:
          description: Response data payload
    StandardErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: Error message description
    ReorderRequest:
      type: object
      required:
      - action
      properties:
        action:
          type: string
          enum:
          - move-up
          - move-down
